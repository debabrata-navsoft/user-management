<div class="card password-card">
  <div class="card-header">
    <div class="header-icon">
      <lucide-icon name="key" [size]="20"></lucide-icon>
    </div>
    <div>
      <h3 class="card-title">Change Password</h3>
      <span class="card-subtitle">Keep your account secure with a strong unique password</span>
    </div>
  </div>

  <div class="card-body">
    @if (errorMessage()) {
      <div class="alert alert-error">
        <lucide-icon name="alert-circle" [size]="18"></lucide-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="pwd-form">
      <!-- Current Password -->
      <app-form-field
        label="Current Password"
        [control]="form.controls['currentPassword']"
        [required]="true"
      >
        <div class="password-wrapper">
          <lucide-icon name="lock" [size]="16" class="input-icon"></lucide-icon>
          <input
            id="currentPassword"
            [type]="showCurrentPassword() ? 'text' : 'password'"
            formControlName="currentPassword"
            placeholder="••••••••"
            class="form-control"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-pwd-btn"
            (click)="showCurrentPassword.set(!showCurrentPassword())"
            [attr.aria-label]="showCurrentPassword() ? 'Hide password' : 'Show password'"
          >
            <lucide-icon
              [name]="showCurrentPassword() ? 'eye-off' : 'eye'"
              [size]="16"
            ></lucide-icon>
          </button>
        </div>
      </app-form-field>

      <!-- New Password -->
      <app-form-field
        label="New Password"
        [control]="form.controls['newPassword']"
        [required]="true"
      >
        <div class="password-wrapper">
          <lucide-icon name="lock" [size]="16" class="input-icon"></lucide-icon>
          <input
            id="newPassword"
            [type]="showNewPassword() ? 'text' : 'password'"
            formControlName="newPassword"
            placeholder="••••••••"
            class="form-control"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="toggle-pwd-btn"
            (click)="showNewPassword.set(!showNewPassword())"
            [attr.aria-label]="showNewPassword() ? 'Hide password' : 'Show password'"
          >
            <lucide-icon [name]="showNewPassword() ? 'eye-off' : 'eye'" [size]="16"></lucide-icon>
          </button>
        </div>
      </app-form-field>

      <!-- Confirm New Password -->
      <app-form-field
        label="Confirm New Password"
        [control]="form.controls['confirmNewPassword']"
        [required]="true"
      >
        <div class="password-wrapper">
          <lucide-icon name="lock" [size]="16" class="input-icon"></lucide-icon>
          <input
            id="confirmNewPassword"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            formControlName="confirmNewPassword"
            placeholder="••••••••"
            class="form-control"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="toggle-pwd-btn"
            (click)="showConfirmPassword.set(!showConfirmPassword())"
            [attr.aria-label]="showConfirmPassword() ? 'Hide password' : 'Show password'"
          >
            <lucide-icon
              [name]="showConfirmPassword() ? 'eye-off' : 'eye'"
              [size]="16"
            ></lucide-icon>
          </button>
        </div>
      </app-form-field>

      <div class="form-action">
        <app-ui-button type="submit" variant="primary" size="lg" [loading]="isLoading()">
          Update Password
        </app-ui-button>
      </div>
    </form>
  </div>
</div>
