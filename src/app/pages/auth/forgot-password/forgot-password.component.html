<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand">
        <div class="brand-badge">
          <lucide-icon name="users" [size]="28"></lucide-icon>
        </div>
        <h2>UserManage</h2>
      </div>
      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-subtitle">
        Enter your registered email and we'll check your account to reset your password
      </p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        <lucide-icon name="alert-circle" [size]="18"></lucide-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <app-form-field label="Registered Email" [control]="form.controls['email']" [required]="true">
        <div class="input-wrapper">
          <lucide-icon name="mail" [size]="16" class="input-icon"></lucide-icon>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="name@example.com"
            class="form-control"
            autocomplete="email"
          />
        </div>
      </app-form-field>

      <div class="form-action">
        <app-ui-button
          type="submit"
          variant="primary"
          size="lg"
          [fullWidth]="true"
          [loading]="isLoading()"
        >
          Verify & Continue
        </app-ui-button>
      </div>
    </form>

    <div class="auth-footer">
      <p>Remembered your password? <a routerLink="/login">Back to Sign in</a></p>
    </div>
  </div>
</div>
