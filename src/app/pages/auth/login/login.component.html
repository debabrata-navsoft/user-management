<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand">
        <div class="brand-badge">
          <lucide-icon name="users" [size]="26"></lucide-icon>
        </div>
        <h2>UserManage</h2>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Enter your credentials to access your portal</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        <lucide-icon name="alert-circle" [size]="18"></lucide-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Username / Email Field -->
      <app-form-field label="Username / Email Address" [control]="form.controls['identifier']">
        <div class="input-wrapper">
          <lucide-icon name="mail" [size]="16" class="input-icon"></lucide-icon>
          <input
            id="identifier"
            type="text"
            formControlName="identifier"
            placeholder="Enter username or email"
            class="form-control"
            autocomplete="username"
          />
        </div>
      </app-form-field>

      <!-- Password Field -->
      <app-form-field label="Password" [control]="form.controls['password']">
        <div class="input-wrapper">
          <lucide-icon name="lock" [size]="16" class="input-icon"></lucide-icon>
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            class="form-control"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-pwd-btn"
            (click)="toggleShowPassword()"
            aria-label="Toggle password visibility"
          >
            <lucide-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="16"></lucide-icon>
          </button>
        </div>
        <div class="forgot-password-row">
          <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>
      </app-form-field>

      <div class="form-action">
        <app-ui-button
          type="submit"
          variant="primary"
          size="lg"
          [fullWidth]="true"
          [loading]="isLoading()"
        >
          Sign In
        </app-ui-button>
      </div>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/signup">Sign up</a></p>
    </div>
  </div>
</div>
