<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand">
        <div class="brand-badge">
          <lucide-icon name="users" [size]="28"></lucide-icon>
        </div>
        <h2>UserManage</h2>
      </div>
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">
        Create a strong new password for <strong>{{ targetEmail() }}</strong>
      </p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        <lucide-icon name="alert-circle" [size]="18"></lucide-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <app-form-field
        label="New Password"
        [control]="form.controls['newPassword']"
        [required]="true"
      >
        <div class="input-wrapper">
          <lucide-icon name="lock" [size]="16" class="input-icon"></lucide-icon>
          <input
            id="newPassword"
            [type]="showNewPassword() ? 'text' : 'password'"
            formControlName="newPassword"
            placeholder="••••••••"
            class="form-control"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="toggle-pwd-btn"
            (click)="toggleShowNewPassword()"
            aria-label="Toggle password visibility"
          >
            <lucide-icon [name]="showNewPassword() ? 'eye-off' : 'eye'" [size]="16"></lucide-icon>
          </button>
        </div>
      </app-form-field>

      <app-form-field
        label="Confirm New Password"
        [control]="form.controls['confirmPassword']"
        [required]="true"
      >
        <div class="input-wrapper">
          <lucide-icon name="lock" [size]="16" class="input-icon"></lucide-icon>
          <input
            id="confirmPassword"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="••••••••"
            class="form-control"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="toggle-pwd-btn"
            (click)="toggleShowConfirmPassword()"
            aria-label="Toggle confirm password visibility"
          >
            <lucide-icon
              [name]="showConfirmPassword() ? 'eye-off' : 'eye'"
              [size]="16"
            ></lucide-icon>
          </button>
        </div>
      </app-form-field>

      <div class="form-action">
        <app-ui-button
          type="submit"
          variant="primary"
          size="lg"
          [fullWidth]="true"
          [loading]="isLoading()"
        >
          Update Password & Sign In
        </app-ui-button>
      </div>
    </form>

    <div class="auth-footer">
      <p>Remembered your password? <a routerLink="/login">Back to Sign in</a></p>
    </div>
  </div>
</div>
