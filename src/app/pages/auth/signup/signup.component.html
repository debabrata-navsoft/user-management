<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand">
        <div class="brand-badge">
          <lucide-icon name="users" [size]="28"></lucide-icon>
        </div>
        <h2>UserManage</h2>
      </div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Sign up to get access to your User Dashboard</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        <lucide-icon name="alert-circle" [size]="18"></lucide-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <app-form-field label="Full Name" [control]="form.controls['name']" [required]="true">
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="Enter your full name"
          class="form-control"
        />
      </app-form-field>

      <app-form-field label="Email Address" [control]="form.controls['email']" [required]="true">
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter your email address"
          class="form-control"
          (blur)="onEmailBlur()"
        />
      </app-form-field>

      <app-form-field label="Role" [control]="form.controls['role']" [required]="true">
        <select id="role" formControlName="role" class="form-control">
          <option value="">Please Select</option>
          <option value="employee">Employee</option>
          <option value="manager">Manager</option>
          <option value="admin">Admin</option>
        </select>
      </app-form-field>

      <app-form-field label="Department" [control]="form.controls['department']" [required]="true">
        <select id="department" formControlName="department" class="form-control">
          <option value="">Please Select</option>
          <option value="Engineering">Engineering</option>
          <option value="Sales">Sales</option>
          <option value="Design">Design</option>
          <option value="Support">Support</option>
          <option value="Finance">Finance</option>
        </select>
      </app-form-field>

      <!-- Phone gets its own row: the code picker plus the number needs the width. -->
      <app-form-field label="Phone Number (Optional)" [control]="form.controls['phone']">
        <app-phone-input inputId="phone" formControlName="phone"></app-phone-input>
      </app-form-field>

      <app-form-field label="Password" [control]="form.controls['password']" [required]="true">
        <div class="input-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            class="form-control"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="toggle-pwd-btn"
            (click)="toggleShowPassword()"
            aria-label="Toggle password visibility"
          >
            <lucide-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="16"></lucide-icon>
          </button>
        </div>
      </app-form-field>

      <app-form-field
        label="Confirm Password"
        [control]="form.controls['confirmPassword']"
        [required]="true"
      >
        <div class="input-wrapper">
          <input
            id="confirmPassword"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="••••••••"
            class="form-control"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="toggle-pwd-btn"
            (click)="toggleShowConfirmPassword()"
            aria-label="Toggle confirm password visibility"
          >
            <lucide-icon
              [name]="showConfirmPassword() ? 'eye-off' : 'eye'"
              [size]="16"
            ></lucide-icon>
          </button>
        </div>
      </app-form-field>

      <div class="form-action">
        <app-ui-button
          type="submit"
          variant="primary"
          size="lg"
          [fullWidth]="true"
          [loading]="isLoading()"
        >
          Create Account
        </app-ui-button>
      </div>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
