<div class="profile-page">
  <app-page-header
    title="My Profile & Security"
    subtitle="Manage personal contact information, role permissions and account password"
    badgeText="Security Center"
  ></app-page-header>

  <div class="profile-layout-grid">
    <!-- Left Column: User Summary Card -->
    @if (currentUser(); as user) {
      <div class="card profile-info-card">
        <div class="profile-header-banner">
          <div class="profile-large-avatar">{{ userInitials() }}</div>
        </div>

        <div class="profile-card-body">
          <div class="user-primary-meta">
            <h2 class="user-display-name">{{ user.name }}</h2>
            <p class="user-email-text">{{ user.email }}</p>
            <div class="role-badge-wrap">
              <app-badge [variant]="'primary'" [dot]="true">{{ user.role }}</app-badge>
              <app-badge [variant]="user.status === 'active' ? 'success' : 'danger'">{{
                user.status
              }}</app-badge>
            </div>
          </div>

          <div class="profile-info-list">
            <div class="info-row">
              <span class="info-label">User ID</span>
              <span class="info-val">#{{ user.id }}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Department</span>
              <span class="info-val">{{ user.department || 'General' }}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Phone</span>
              <span class="info-val">{{ user.phone || 'Not provided' }}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Member Since</span>
              <span class="info-val">{{ formatDate(user.createdAt) }}</span>
            </div>
          </div>
        </div>
      </div>
    }

    <!-- Right Column: Change Password & Security Component -->
    <div class="profile-password-col">
      <app-change-password></app-change-password>
    </div>
  </div>
</div>
