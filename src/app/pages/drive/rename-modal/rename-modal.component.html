<app-modal [isOpen]="isOpen()" title="Rename Item" size="sm" (close)="onClose()">
  <div class="modal-form-body">
    <div class="form-group">
      <label for="renameInput">New Name</label>
      <input
        id="renameInput"
        type="text"
        class="form-control"
        [class.is-invalid]="!!renameError()"
        [value]="renameValue()"
        (input)="onInput($event)"
        (keydown.enter)="submit()"
      />
      @if (renameError()) {
        <span class="form-error">{{ renameError() }}</span>
      }
    </div>
  </div>

  <div footer>
    <app-ui-button variant="secondary" size="md" (click)="onClose()">Cancel</app-ui-button>
    <app-ui-button variant="primary" size="md" [loading]="isSubmitting()" (click)="submit()">
      Save Name
    </app-ui-button>
  </div>
</app-modal>
