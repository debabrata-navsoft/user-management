<div class="magnifier-container">
  <div
    #imageWrapper
    class="main-image-wrapper"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
    (mousemove)="onMouseMove($event)"
    (touchstart)="onTouchStart($event)"
    (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd()"
    (click)="onImageClick()"
    title="Click to view fullscreen lightbox"
  >
    <img
      #mainImg
      [src]="imageUrl()"
      [alt]="alt()"
      class="main-img"
      (load)="onImageLoaded()"
      (error)="onImageError()"
    />

    @if (isLoading()) {
      <div class="img-loading-overlay">
        <div class="mini-spinner"></div>
      </div>
    }

    @if (hasError()) {
      <div class="img-error-overlay">
        <lucide-icon name="alert-circle" [size]="32"></lucide-icon>
        <span>Failed to load image</span>
      </div>
    }

    <!-- Click To Expand Badge Overlay -->
    @if (!isLoading() && !hasError()) {
      <div class="expand-hint-badge">
        <lucide-icon name="maximize-2" [size]="13" [strokeWidth]="2.5"></lucide-icon>
        <span>Click to expand</span>
      </div>
    }

    <!-- Hover Lens indicator -->
    @if (isHovering() && !hasError() && !isLoading()) {
      <div
        class="magnifier-lens"
        [style.left.px]="lensPosition().x"
        [style.top.px]="lensPosition().y"
        [style.width.px]="lensWidth()"
        [style.height.px]="lensHeight()"
      ></div>
    }
  </div>

  <!-- Zoomed Preview Window -->
  @if (isHovering() && !hasError() && !isLoading()) {
    <div #zoomWindow class="zoom-result-window">
      <div
        class="zoom-result-image"
        [style.background-image]="'url(' + imageUrl() + ')'"
        [style.background-position]="bgPosition()"
        [style.background-size]="bgSize()"
      ></div>
      <div class="zoom-badge">
        <span>{{ zoomLevel() }}x HD Zoom</span>
      </div>
    </div>
  }
</div>
