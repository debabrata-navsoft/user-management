<app-modal
  [isOpen]="isOpen()"
  [title]="title()"
  size="sm"
  [closable]="!loading()"
  (close)="cancelled.emit()"
>
  <div class="confirm-content">
    <div class="confirm-icon" [class.danger]="danger()">
      <lucide-icon [name]="danger() ? 'triangle-alert' : 'alert-circle'" [size]="24"></lucide-icon>
    </div>
    <div class="confirm-text">
      <p>{{ message() }}</p>
    </div>
  </div>

  <div footer>
    <app-ui-button variant="secondary" size="md" [disabled]="loading()" (click)="cancelled.emit()">
      {{ cancelText() }}
    </app-ui-button>
    <app-ui-button
      [variant]="danger() ? 'danger' : 'primary'"
      size="md"
      [loading]="loading()"
      (click)="confirmed.emit()"
    >
      {{ confirmText() }}
    </app-ui-button>
  </div>
</app-modal>
