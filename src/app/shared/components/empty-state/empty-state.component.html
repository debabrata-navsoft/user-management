<div class="empty-state-box">
  <div class="icon-circle">
    <lucide-icon name="circle-minus" [size]="32" [strokeWidth]="1.8"></lucide-icon>
  </div>
  <h3 class="empty-title">{{ title() }}</h3>
  <p class="empty-desc">{{ description() }}</p>

  @if (actionText()) {
    <div class="empty-action">
      <app-ui-button variant="primary" size="md" (click)="action.emit()">
        {{ actionText() }}
      </app-ui-button>
    </div>
  }
</div>
